<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Forge RAG Lab — proof film</title>
<style>
  :root{
    --cream:#f5f1e8;
    --cream-2:#fbf9f2;
    --ink:#1d1e1c;
    --muted:#706c63;
    --ember:#c4502b;
    --ember-deep:#7e2b18;
    --ember-soft:#f3e2d9;
    --moss:#116b57;
    --moss-deep:#0b5747;
    --moss-soft:#e3efea;
    --hair:rgba(29,30,28,.13);
    --serif:"P052","Palatino Linotype",Palatino,"URW Palladio L",Georgia,serif;
    --sans:"Nimbus Sans","Liberation Sans",Arial,sans-serif;
    --mono:"Nimbus Mono PS","DejaVu Sans Mono","Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:#111}
  body{font-family:var(--sans);color:var(--ink)}
  #stage{
    position:relative;width:1920px;height:1080px;overflow:hidden;
    background:var(--cream);color:var(--ink);
    -webkit-font-smoothing:antialiased;
  }
  .shot{position:absolute;inset:0;display:none;overflow:hidden}
  .display{font-family:var(--serif);font-weight:400;letter-spacing:-.035em;line-height:1.02}
  .kicker{
    font-family:var(--mono);font-size:21px;line-height:1;font-weight:600;
    letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    display:flex;align-items:center;gap:14px;
  }
  .kicker.ember{color:var(--ember)}
  .kicker.moss{color:var(--moss)}
  .dot{width:10px;height:10px;border-radius:50%;background:var(--ember);display:inline-block;flex:none}
  .dot.moss{background:var(--moss)}
  .mono{font-family:var(--mono);letter-spacing:.14em;text-transform:uppercase}
  .sans{font-family:var(--sans)}
  .ui-crop{position:absolute;overflow:hidden;background:#fff;border-radius:12px}
  .ui-crop img{position:absolute;max-width:none;display:block}
  .frame{position:absolute;border:1px solid var(--hair);border-radius:14px;background:var(--cream-2);box-shadow:0 18px 60px rgba(29,30,28,.10)}
  .ring{position:absolute;border:4px solid var(--ember);border-radius:9px;opacity:0;
    box-shadow:0 0 0 9px rgba(196,80,43,.13)}
  .ring.moss{border-color:var(--moss);box-shadow:0 0 0 9px rgba(17,107,87,.13)}
  .rule{position:absolute;height:2px;background:var(--hair)}
  .chip{
    display:inline-flex;align-items:center;gap:10px;height:46px;padding:0 20px;border-radius:999px;
    border:1px solid var(--hair);background:rgba(251,249,242,.72);
    font-family:var(--mono);font-size:18px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);
  }
  .chip .dot{width:8px;height:8px}
  .chip.moss{border-color:rgba(17,107,87,.28);background:var(--moss-soft);color:var(--moss)}
  .chip.ember{border-color:rgba(196,80,43,.28);background:var(--ember-soft);color:var(--ember)}

  /* captions */
  #captionLayer{position:absolute;inset:0;pointer-events:none;z-index:50}
  #captionBar{
    position:absolute;left:50%;bottom:18px;transform:translateX(-50%);
    max-width:1720px;padding:10px 28px 12px;border-radius:12px;
    background:rgba(251,249,242,.97);
    border:1px solid rgba(29,30,28,.18);
    box-shadow:0 10px 34px rgba(29,30,28,.18);
    color:var(--ink);font-family:var(--sans);font-weight:500;
    font-size:40px;line-height:1.24;letter-spacing:-.012em;text-align:center;
    white-space:pre-line;
    opacity:0;
  }

  /* hook */
  #shot-hook .hook-title{position:absolute;left:118px;top:118px;font-size:102px;width:1600px}
  #shot-hook .ui-note{position:absolute;right:120px;top:88px;font-size:17px;color:var(--muted)}
  #shot-hook .subnote{position:absolute;left:120px;top:286px;font-size:18px;color:var(--ember)}

  /* framing */
  #shot-framing .title{position:absolute;left:118px;top:112px;font-size:66px}
  #shot-framing .chips{position:absolute;left:120px;top:236px;display:flex;gap:14px}
  #shot-framing .uline{position:absolute;left:120px;top:215px;height:5px;background:var(--moss);width:0}
  #shot-framing .small{position:absolute;left:122px;top:292px;font-size:20px;color:var(--muted)}

  /* split */
  #shot-split .q{position:absolute;left:80px;top:112px;font-size:17px;color:var(--muted)}
  #shot-split .lab{position:absolute;top:156px;font-size:21px;font-weight:600;display:flex;gap:12px;align-items:center}
  #shot-split .lab .dot{width:9px;height:9px}
  #shot-split .verdict{position:absolute;top:548px;font-size:56px;width:820px}
  #shot-split .vline{position:absolute;left:958px;top:150px;width:1px;height:560px;background:var(--hair)}

  /* citations */
  #shot-citations .title,#shot-citationsB .title{position:absolute;left:118px;top:116px;font-size:68px}
  #shot-citations .fixedchip{position:absolute;right:120px;top:118px}
  #shot-citations .meta-row,#shot-citationsB .meta-row{position:absolute;left:120px;display:flex;flex-direction:column;gap:4px}
  #shot-citations .meta-lab,#shot-citationsB .meta-lab{font-size:17px;letter-spacing:.16em;color:var(--muted);font-family:var(--mono);text-transform:uppercase}
  #shot-citations .meta-val,#shot-citationsB .meta-val{font-size:58px;font-family:var(--mono);letter-spacing:-.02em;line-height:1.05}
  #shot-citations .meta-rule,#shot-citationsB .meta-rule{position:absolute;left:100px;top:254px;width:5px;height:442px;background:var(--moss);opacity:.9}
  #shot-citations .quote-lab,#shot-citationsB .quote-lab{position:absolute;font-size:16px;letter-spacing:.16em;color:var(--moss);font-family:var(--mono);text-transform:uppercase}

  /* why */
  #shot-why .health{position:absolute;left:0;top:0;width:1920px;height:1080px;overflow:hidden}
  #shot-why .health img{position:absolute;left:0;max-width:none}
  #shot-why .step{position:absolute;top:128px;width:462px;height:232px;border-radius:18px;background:var(--cream-2);border:1px solid var(--hair);padding:24px 26px;box-shadow:0 16px 40px rgba(29,30,28,.12)}
  #shot-why .step .num{font-family:var(--mono);font-size:18px;letter-spacing:.14em;color:var(--muted)}
  #shot-why .step .h{font-family:var(--serif);font-size:46px;letter-spacing:-.03em;line-height:1;margin-top:10px}
  #shot-why .step .b{font-size:20px;line-height:1.3;color:var(--muted);margin-top:10px}
  #shot-why .step.done{border-color:rgba(17,107,87,.45)}
  #shot-why .step .bar{position:absolute;left:0;top:0;height:5px;width:100%;border-radius:18px 18px 0 0;background:var(--hair)}
  #shot-why .step.on .bar{background:var(--moss)}
  #shot-why .ringrow{position:absolute;border:3px solid var(--moss);border-radius:10px;opacity:0;box-shadow:0 0 0 8px rgba(17,107,87,.10);z-index:3}
  #shot-why .caption-space{position:absolute;left:0;bottom:0;height:150px;width:100%;background:linear-gradient(to top,rgba(245,241,232,.95),rgba(245,241,232,0));z-index:2}

  /* number */
  #shot-number .bg{position:absolute;inset:0;opacity:.19}
  #shot-number .veil{position:absolute;inset:0;background:rgba(245,241,232,.76)}
  #shot-number .card{position:absolute;left:210px;top:132px;width:1500px;height:748px}
  #shot-number .num{font-family:var(--serif);font-size:206px;line-height:1;letter-spacing:-.045em}
  #shot-number .lab{font-family:var(--mono);font-size:20px;letter-spacing:.18em}
  #shot-number .sub{font-size:29px;color:var(--muted)}
  #shot-number .strike{position:absolute;height:11px;background:var(--ember);opacity:0;transform-origin:left center;border-radius:2px}
  #shot-number .sixteen{position:absolute;opacity:0}
  #shot-number .check{position:absolute;opacity:0}

  /* end */
  #shot-end .kicker{position:absolute;left:160px;top:128px}
  #shot-end .headline{position:absolute;left:156px;top:178px;font-size:118px;width:1500px}
  #shot-end .sub{position:absolute;left:160px;top:352px;font-size:60px;color:var(--muted)}
  #shot-end .cta{position:absolute;left:160px;top:474px;height:104px;padding:0 38px 0 42px;border-radius:12px;background:var(--ink);color:var(--cream);display:flex;align-items:center;gap:24px;font-size:48px;font-weight:600;letter-spacing:-.01em}
  #shot-end .url{position:absolute;left:162px;top:642px;font-family:var(--mono);font-size:54px;letter-spacing:.01em}
  #shot-end .proof{position:absolute;left:162px;top:716px;width:1640px;font-size:48px;line-height:1.24;color:var(--ink);white-space:pre-line;letter-spacing:-.01em}
  #shot-end .uline{position:absolute;height:6px;background:var(--moss);width:0;left:166px;top:322px}
  #shot-end .ghost{position:absolute;right:-40px;bottom:-120px;font-family:var(--serif);font-size:360px;line-height:1;color:rgba(17,107,87,.04);letter-spacing:-.06em}
  #shot-end .side{position:absolute;right:166px;top:180px;width:360px;text-align:right;font-family:var(--mono);font-size:17px;line-height:1.9;letter-spacing:.14em;color:var(--muted);text-transform:uppercase}
  #shot-end .side b{color:var(--moss);font-weight:600}
</style>
</head>
<body>
<div id="stage">
  <div id="shots"></div>
  <div id="captionLayer"><div id="captionBar"></div></div>
</div>
<script src="film.js"></script>
</body>
</html>
