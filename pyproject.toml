[project]
name = "forge-rag-lab"
version = "0.1.0"
description = "End-to-end RAG reliability lab with versioned docs, citations and evals"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "pydantic>=2.9",
  "pydantic-settings>=2.5",
  "PyYAML>=6.0",
  "httpx>=0.27",
  "qdrant-client>=1.12",
  "fastembed>=0.9",
  "ragas>=0.4.3",
  "datasets>=3.0",
  "pandas>=2.2",
  "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0",
  "pytest-asyncio>=0.24",
  "ruff>=0.7",
  "mypy>=1.11",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
